<!-- ==================== PYTHON ENGINE CORE ==================== -->
<script type="py">
import math

def calc_fee_py(checkin_ms, now_ms, free_minutes, rate_per_hour):
    minutes = max(0, round((now_ms - checkin_ms) / 60000))
    if minutes <= free_minutes:
        return {"minutes": minutes, "hours_billed": 0, "fee": 0, "free": True}
    billable_minutes = minutes - free_minutes
    hours_billed = math.ceil(billable_minutes / 60)
    fee = hours_billed * rate_per_hour
    return {"minutes": minutes, "hours_billed": hours_billed, "fee": fee, "free": False}

def crc16_py(data):
    crc = 0xFFFF
    for char in data:
        crc ^= ord(char) << 8
        for _ in range(8):
            if crc & 0x8000:
                crc = ((crc << 1) ^ 0x1021) & 0xFFFF
            else:
                crc = (crc << 1) & 0xFFFF
    return f"{crc:04X}"
</script>

function tr(k){ return STR[LANG][k] || k; }
function dtLocale(){ return LANG === "th" ? "th-TH" : "en-GB"; }

function generatePromptPayPayload(phone, amount){
  function tlv(id, val){ return id + String(val.length).padStart(2,'0') + val; }
  const digits = phone.replace(/[^0-9]/g, '').replace(/^0/, '66').padStart(13, '0');
  const merchantInfo = tlv('00', 'A000000677010111') + tlv('01', digits);
  let payload = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('29', merchantInfo) + tlv('58', 'TH') + tlv('53', '764');
  if(amount) payload += tlv('54', amount.toFixed(2));
  payload += '6304';

  let crc = "";
  try {
    crc = pyscript.interpreter.globals.get('crc16_py')(payload);
  } catch(e) {
    let c = 0xFFFF;
    for(let i=0; i<payload.length; i++){
      c ^= (payload.charCodeAt(i) << 8);
      for(let j=0; j<8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
    }
    crc = c.toString(16).toUpperCase().padStart(4, '0');
  }
  return payload + crc;
}

function fmtDateTime(ms){
  return new Date(ms).toLocaleString(dtLocale(), { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
}

function fmtDuration(m){
  const h = Math.floor(m/60), mins = m % 60;
  if(LANG==='en') return h<=0 ? mins+" min" : h+" hr "+mins+" min";
  return h<=0 ? mins+" นาที" : h+" ชม. "+mins+" นาที";
}

function fmtCountdown(s){
  const m = Math.floor(s/60), sec = s % 60;
  return m + ":" + String(sec).padStart(2,"0");
}

function stopCamera(){
  camScanning = false;
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
}

async function startCamera(){
  const video = document.getElementById("camVideo");
  const statusEl = document.getElementById("scanStatus");
  try{
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = camStream;
    await video.play();
    if(statusEl) statusEl.textContent = tr('scan_status_scanning');
    camScanning = true;
    requestAnimationFrame(scanLoop);
  }catch(e){
    if(statusEl) statusEl.textContent = "เปิดกล้องไม่สำเร็จ: " + e.message;
  }
}

function scanLoop(){
  if(!camScanning) return;
  const video = document.getElementById("camVideo");
  if(video && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0){
    scanCanvas.width = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    const ctx = scanCanvas.getContext("2d");
    ctx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
    const imgData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height);
    if(code && code.data){
      handleScanResult(code.data);
      return;
    }
  }
  requestAnimationFrame(scanLoop);
}

function renderScanScreen(){
  if(payTimerInterval){ clearInterval(payTimerInterval); payTimerInterval = null; }
  const view = document.getElementById("view");
  view.innerHTML = `
    <div class="panel fade-in">
      <p class="panel-title">${tr('scan_title')}</p>
      <p class="panel-sub">${tr('scan_sub')}</p>
      <div class="viewfinder">
        <video id="camVideo" autoplay playsinline muted></video>
        <div class="vf-corner vf-tl"></div>
        <div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div>
        <div class="vf-corner vf-br"></div>
      </div>
      <p id="scanStatus" class="scan-status">${tr('scan_status_opening')}</p>
    </div>
  `;
  startCamera();
}

function parseTicket(text){
  try{
    const hIdx = text.indexOf("#");
    const hPart = hIdx >= 0 ? text.slice(hIdx + 1) : text;
    const qIdx = hPart.indexOf("?");
    const qs = qIdx >= 0 ? hPart.slice(qIdx + 1) : hPart;
    const params = new URLSearchParams(qs);
    const id = params.get("id");
    const t = Number(params.get("t"));
    if(id && t) return { id, t };
  }catch(e){}
  return null;
}

function lineItem(label, value){
  return `<div class="li"><span class="lbl">${label}</span><span class="fill"></span><span class="val">${value}</span></div>`;
}

function handleScanResult(text){
  stopCamera();
  const ticket = parseTicket(text);
  const view = document.getElementById("view");

  if(!ticket){
    view.innerHTML = `
      <div class="receipt-wrap fade-in">
        <div class="torn top"></div>
        <div class="receipt error">
          <div class="store"><div class="store-name">SMART PARKING</div></div>
          <div class="dash"></div>
          <p class="msg-title">${tr('read_fail_title')}</p>
          <p class="msg-sub">${tr('read_fail_sub')}</p>
        </div>
        <div class="torn bottom"></div>
      </div>
      <button class="btn on-paper" id="retryBtn">${tr('retry_btn')}</button>
    `;
    document.getElementById("retryBtn").onclick = renderScanScreen;
    return;
  }

  const now = Date.now();
  let result = {};

  try {
    const pyCalc = pyscript.interpreter.globals.get('calc_fee_py');
    const pyRes = pyCalc(ticket.t, now, CONFIG.FREE_MINUTES, CONFIG.RATE_PER_HOUR);
    result = pyRes.toJs();
  } catch(e) {
    const minutes = Math.max(0, Math.round((now - ticket.t) / 60000));
    const free = minutes <= CONFIG.FREE_MINUTES;
    const hoursBilled = free ? 0 : Math.ceil((minutes - CONFIG.FREE_MINUTES) / 60);
    result = { minutes, hours_billed: hoursBilled, fee: hoursBilled * CONFIG.RATE_PER_HOUR, free };
  }

  const thaiSvg = `

  view.innerHTML = `
    <div class="receipt-wrap">
      <div class="torn top"></div>
      <div class="receipt print-in" id="receiptCard">
        <div class="stamp stamp-in ${result.free ? 'ok' : ''}">${result.free ? tr('badge_free') : tr('badge_paid')}</div>
        <div class="store">
          <div class="store-name">SMART PARKING</div>
          <div class="store-sub">${tr('exit_title')}</div>
        </div>
        <div class="dash"></div>
        ${lineItem(tr('label_id'), ticket.id)}
        ${lineItem(tr('label_checkin'), fmtDateTime(ticket.t))}
        ${lineItem(tr('label_checkout'), fmtDateTime(now))}
        ${lineItem(tr('label_duration'), fmtDuration(result.minutes))}
        <div class="fee-amount">${CONFIG.CURRENCY}${result.fee.toLocaleString(dtLocale())}<span class="thb">${LANG==='th'?'บาท':'THB'}</span></div>
        <p class="fee-sub">${result.free ? (LANG==='th'?`ไม่เกิน ${CONFIG.FREE_MINUTES} นาทีแรก (ฟรี)`:`Within first ${CONFIG.FREE_MINUTES} min (free)`) : (LANG==='th'?`คิด ${result.hours_billed} ชม. x ${CONFIG.CURRENCY}${CONFIG.RATE_PER_HOUR}`:`${result.hours_billed} hr x ${CONFIG.CURRENCY}${CONFIG.RATE_PER_HOUR}`)}</p>
        ${!result.free ? `
          <div class="dash"></div>
          <div class="barcode-label">${tr('barcode_label')}</div>
          <div class="thaiqr-card">
            <div class="thaiqr-header">${thaiSvg}</div>
            <div class="thaiqr-body">
              <div class="promptpay-logo">
                <div class="pp-th">พร้อมเพย์</div>
                <div class="pp-en"><span class="prompt">Prompt</span><span class="pay">Pay</span></div>
              </div>
              <div id="paySection">
                <div class="qr-wrap" id="payQrWrap"></div>
                <p class="pay-timer" id="payTimer"><span class="lbl">${tr('timer_label')}</span><span id="payTimerValue">${fmtCountdown(CONFIG.PAYMENT_TIMEOUT_SECONDS)}</span></p>
              </div>
            </div>
          </div>
          <div class="thaiqr-footer">
            <span class="fname-label">${tr('fname_label')}</span>
            <span class="fname-value">${CONFIG.ACCOUNT_NAME}</span>
          </div>
        ` : ''}
      </div>
      <div class="torn bottom"></div>
    </div>
    <button class="btn no-print" id="printBtn">${tr('print_btn')}</button>
    <button class="btn btn-ghost no-print" id="nextScanBtn">${tr('next_scan_btn')}</button>
  `;

  if(!result.free){
    new QRCode(document.getElementById("payQrWrap"), { text: generatePromptPayPayload(CONFIG.PROMPTPAY_ID, result.fee), width: 200, height: 200 });

    let remaining = CONFIG.PAYMENT_TIMEOUT_SECONDS;
    payTimerInterval = setInterval(() => {
      remaining -= 1;
      if(remaining <= 0){
        clearInterval(payTimerInterval);
        const paySection = document.getElementById("paySection");
        if(paySection){
          paySection.innerHTML = `
            <div class="pay-expired">
              <p class="msg">${tr('timer_expired_msg')}</p>
              <button class="btn on-paper no-print" id="refreshPriceBtn">${tr('refresh_price_btn')}</button>
            </div>
          `;
          document.getElementById("refreshPriceBtn").onclick = () => handleScanResult(text);
        }
        return;
      }
      const timerValEl = document.getElementById("payTimerValue");
      if(timerValEl) timerValEl.textContent = fmtCountdown(remaining);
      if(remaining <= 60){
        const timerLblEl = document.getElementById("payTimer");
        if(timerLblEl) timerLblEl.classList.add("warn");
      }
    }, 1000);
  }

  document.getElementById("printBtn").onclick = () => window.print();
  document.getElementById("nextScanBtn").onclick = renderScanScreen;
}

document.addEventListener("DOMContentLoaded", () => {
  const langLabel = document.getElementById("langLabel");
  const langToggle = document.getElementById("langToggle");
  if(langToggle){
    langToggle.onclick = () => {
      stopCamera();
      LANG = LANG === "th" ? "en" : "th";
      if(langLabel) langLabel.textContent = LANG === "th" ? "EN" : "TH";
      renderScanScreen();
    };
  }
  renderScanScreen();
});
</script>
