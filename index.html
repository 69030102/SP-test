<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART PARKING — รับบัตรจอดรถ</title>

<!-- PyScript Core Engine -->
<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --ink:#14161d;
    --ink-2:#1d202a;
    --paper:#efe6d2;
    --paper-2:#e2d5b6;
    --text:#221d13;
    --muted:#8a7f68;
    --amber:#d98b2b;
    --stripe:#221d13;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse at top, rgba(217,139,43,0.10), transparent 55%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:52px 20px;
  }
  .app{ width:100%; max-width:420px; }

  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .logo{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:15px; letter-spacing:0.5px; color:var(--paper); }
  .logo span{ color:var(--amber); }

  .lang-toggle{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    background:var(--ink-2); border:1px solid rgba(239,230,210,0.18); border-radius:4px;
    cursor:pointer; font-family:'Roboto Mono',monospace; font-size:11px; font-weight:700; color:var(--paper);
  }
  .lang-toggle:hover{ border-color:var(--amber); color:var(--amber); }
  .lang-toggle:focus-visible, .btn:focus-visible, .staff-link:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  .stripe-bar{
    height:8px; border-radius:4px 4px 0 0;
    background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--stripe) 10px 20px);
  }

  .card{
    background:var(--paper);
    border-radius:0 0 4px 4px;
    box-shadow: 7px 7px 0 var(--stripe);
    padding:30px 26px 26px;
    margin-bottom:22px;
  }

  .status{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .status svg{ width:20px; height:20px; flex-shrink:0; }
  .status-text{ font-family:'Roboto Mono',monospace; font-size:11px; color:var(--muted); }

  h1{ font-family:'Roboto Mono',monospace; font-size:21px; font-weight:700; line-height:1.35; margin:0 0 8px 0; }
  .sub{ font-size:14px; color:var(--muted); line-height:1.55; margin:0 0 22px 0; max-width:34ch; }

  .qr-wrap{
    display:flex; justify-content:center; padding:18px;
  }
  .qr-frame{
    border:2px dashed rgba(34,29,19,0.35); border-radius:50%;
    padding:14px; transform:rotate(-3deg);
    background:#fff;
  }
  #qrcode img, #qrcode canvas{ display:block; border-radius:3px; }

  .row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:11px 0; border-top:1px solid rgba(34,29,19,0.12);
  }
  .row:first-of-type{ border-top:none; }
  .row .label{ font-size:12.5px; color:var(--muted); }
  .row .value{ font-size:14px; color:var(--text); font-weight:600; font-family:'Roboto Mono',monospace; }

  .ticket-id{
    font-family:'Roboto Mono',monospace; font-weight:700;
    font-size:34px; letter-spacing:0.5px; line-height:1.1;
    margin:2px 0 18px 0; word-break:break-all;
  }

  .stub{
    position:relative;
    margin:22px -26px 18px;
    padding:0 26px;
    height:1px;
    background-image: repeating-linear-gradient(to right, rgba(34,29,19,0.35) 0 6px, transparent 6px 13px);
  }
  .stub::before, .stub::after{
    content:""; position:absolute; top:50%; transform:translateY(-50%);
    width:18px; height:18px; border-radius:50%;
    background:var(--ink);
  }
  .stub::before{ left:-9px; }
  .stub::after{ right:-9px; }

  .btn{
    width:100%; display:block; text-align:center; padding:13px 18px;
    border-radius:4px; font-size:14.5px; font-weight:600; font-family:'Inter',sans-serif; border:1.5px solid var(--stripe);
    cursor:pointer; text-decoration:none; transition:transform .12s ease;
    background:var(--stripe); color:var(--paper);
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }

  .footnote{ text-align:center; font-size:12px; color:rgba(239,230,210,0.55); margin-top:16px; line-height:1.6; }

  .error{ text-align:center; }
  .error h1{ color:var(--amber); }

  .staff-link{
    display:block; text-align:center; font-size:12.5px; color:var(--muted);
    text-decoration:none; margin-top:16px; font-weight:500;
  }
  .staff-link:hover{ color:var(--text); }

  @keyframes dispense{
    from{ opacity:0; transform:translateY(28px) rotate(-1.5deg); }
    to{ opacity:1; transform:translateY(0) rotate(0deg); }
  }
  .dispense{ animation: dispense .5s cubic-bezier(.2,.8,.3,1) both; }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .fade-in{ animation: fadeIn .4s ease both; }

  .gate{ transform-origin: 4px 16px; transition: transform .55s cubic-bezier(.34,1.4,.64,1); }
  .gate.up{ transform: rotate(-72deg); }

  @media (prefers-reduced-motion: reduce){
    .dispense, .fade-in{ animation:none !important; }
    .gate{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="logo">SMART <span>PARKING</span></div>
    <button class="lang-toggle" id="langToggle" type="button" aria-label="Toggle language">
      <span id="langLabel">EN</span>
    </button>
  </div>
  <div id="view"></div>
</div>

<!-- ==================== PYTHON CORE ENGINE ==================== -->
<script type="py">
import time
import random

def gen_ticket_id_py():
    t_ms = int(time.time() * 1000)
    t_hex = hex(t_ms)[2:].upper()
    rand_suffix = format(random.randint(0, 255), '02X')
    return "P-" + t_hex[-6:] + rand_suffix
</script>

<!-- ==================== HIGH-PERFORMANCE JS FLOW ENGINE ==================== -->
<script>
const CONFIG = {
  FREE_MINUTES: 60,
  RATE_PER_HOUR: 20,
  CURRENCY: "฿"
};

let LANG = "th";

const STR = {
  th: {
    status_home: "จุดทางเข้า — ประตูปิดอยู่",
    home_title: "สแกน QR เพื่อรับบิลจอดรถ",
    home_sub: "ใช้กล้องมือถือสแกนโค้ดด้านล่าง ระบบจะออกบิลจอดรถให้ทันทีตามเวลาที่สแกน",
    status_ticket: "เข้าจอดแล้ว — ประตูเปิด",
    ticket_title: "บัตรจอดรถของคุณ",
    ticket_sub: "เก็บหน้านี้ไว้ หรือบันทึกเป็นรูปภาพ แสดง QR ด้านล่างตอนออกจากลานจอด",
    label_id: "หมายเลขบัตร",
    label_checkin: "เวลาเข้าจอด",
    ticket_qr_note: "แสดง QR นี้ให้เครื่องสแกนตอนออก",
    save_ticket_btn: "บันทึกบัตรลงมือถือ",
    footnote: h => `ชั่วโมงแรกฟรี จากนั้นคิด ${CONFIG.CURRENCY}${h} ต่อชั่วโมง`,
    not_found_title: "ไม่พบข้อมูลบัตร",
    not_found_sub: "ลิงก์นี้ไม่ถูกต้องหรือหมดอายุ",
    back_home: "กลับหน้าแรก",
    staff_link: "สำหรับเจ้าหน้าที่ (สแกนออก) →"
  },
  en: {
    status_home: "Entry point — gate closed",
    home_title: "Scan the QR to get a parking ticket",
    home_sub: "Use your phone camera to scan the code below. A ticket will be issued instantly.",
    status_ticket: "Checked in — gate open",
    ticket_title: "Your parking ticket",
    ticket_sub: "Keep this page, or save it as an image. Show the QR below when you leave.",
    label_id: "Ticket No.",
    label_checkin: "Check-in time",
    ticket_qr_note: "Show this QR to the scanner when you exit",
    save_ticket_btn: "Save ticket to phone",
    footnote: h => `First hour free, then ${CONFIG.CURRENCY}${h} per hour`,
    not_found_title: "Ticket not found",
    not_found_sub: "This link is invalid or expired.",
    back_home: "Back to home",
    staff_link: "Staff exit scanner →"
  }
};

function tr(k, ...args){
  const v = STR[LANG][k];
  return typeof v === "function" ? v(...args) : v;
}

function dtLocale(){ return LANG === "th" ? "th-TH" : "en-GB"; }

function fmtDateTime(ms){
  return new Date(ms).toLocaleString(dtLocale(), {
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false
  });
}

function playDing(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(1318.51, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.55);
  }catch(e){}
}

function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function parseHash(){
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = hash.split("?");
  const params = new URLSearchParams(qs || "");
  return { path: path || "/", params };
}

function buildUrl(path, params){
  const qs = new URLSearchParams(params).toString();
  return location.origin + location.pathname + "#" + path + (qs ? "?" + qs : "");
}

function gateIcon(id, isUp){
  return `
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="3" width="5" height="26" rx="1" fill="var(--stripe)"/>
    <line class="gate${isUp ? ' up' : ''}" id="${id}" x1="4" y1="16" x2="27" y2="16" stroke="var(--stripe)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="4" cy="16" r="2.5" fill="var(--amber)"/>
  </svg>`;
}

function render(){
  const { path, params } = parseHash();
  const view = document.getElementById("view");
  view.innerHTML = "";

  if(path === "/") renderHome(view);
  else if(path === "/checkin") handleCheckin();
  else if(path === "/ticket") renderTicket(view, params);
  else renderNotFound(view);
}

function renderHome(view){
  view.innerHTML = `
    <div class="stripe-bar"></div>
    <div class="card fade-in">
      <div class="status">
        ${gateIcon('gateHome', false)}
        <span class="status-text">${tr('status_home')}</span>
      </div>
      <h1>${tr('home_title')}</h1>
      <p class="sub">${tr('home_sub')}</p>
      <div class="qr-wrap">
        <div class="qr-frame" id="qrcode"></div>
      </div>
      <a class="staff-link" href="exit-scan.html">${tr('staff_link')}</a>
    </div>
  `;
  const url = buildUrl("/checkin", {});
  new QRCode(document.getElementById("qrcode"), { text: url, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M });
}

function handleCheckin(){
  let ticketId = "";
  try {
    if(window.pyscript && pyscript.interpreter && pyscript.interpreter.globals){
      const pyGen = pyscript.interpreter.globals.get('gen_ticket_id_py');
      ticketId = pyGen();
    }
  } catch(e) {}

  if(!ticketId){
    const randSuffix = Math.random().toString(36).slice(2, 4).toUpperCase();
    ticketId = "P-" + Date.now().toString(36).toUpperCase().slice(-6) + randSuffix;
  }

  const t = Date.now();
  location.replace(buildUrl("/ticket", { id: ticketId, t }));
}

function renderTicket(view, params){
  const id = params.get("id");
  const t = Number(params.get("t"));
  if(!id || !t) return renderNotFound(view);

  view.innerHTML = `
    <div class="stripe-bar"></div>
    <div class="card dispense" id="ticketCard">
      <div class="status">
        ${gateIcon('gateTicket', false)}
        <span class="status-text">${tr('status_ticket')}</span>
      </div>
      <p class="sub" style="margin-bottom:4px;">${tr('label_id')}</p>
      <div class="ticket-id">${id}</div>
      <div class="row"><span class="label">${tr('label_checkin')}</span><span class="value">${fmtDateTime(t)}</span></div>
      <div class="stub"></div>
      <div class="qr-wrap">
        <div class="qr-frame" id="qrcode"></div>
      </div>
      <p class="sub" style="margin:12px 0 0 0; text-align:center;">${tr('ticket_qr_note')}</p>
    </div>
    <button class="btn no-print" id="saveBtn">${tr('save_ticket_btn')}</button>
    <p class="footnote">${tr('footnote', CONFIG.RATE_PER_HOUR)}</p>
  `;

  const checkoutUrl = buildUrl("/checkout", { id, t });
  new QRCode(document.getElementById("qrcode"), { text: checkoutUrl, width: 156, height: 156, correctLevel: QRCode.CorrectLevel.M });

  playDing();
  vibrate(60);
  setTimeout(() => {
    const g = document.getElementById("gateTicket");
    if(g) g.classList.add("up");
  }, 120);

  document.getElementById("saveBtn").onclick = () => {
    html2canvas(document.getElementById("ticketCard"), { backgroundColor: "#efe6d2", scale: 2 }).then(canvas => {
      const link = document.createElement("a");
      link.download = "parking-ticket-" + id + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  };
}

function renderNotFound(view){
  view.innerHTML = `
    <div class="stripe-bar"></div>
    <div class="card error fade-in">
      <h1>${tr('not_found_title')}</h1>
      <p class="sub">${tr('not_found_sub')}</p>
      <a class="btn" href="#/">${tr('back_home')}</a>
    </div>
  `;
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  const langLabel = document.getElementById("langLabel");
  const langToggle = document.getElementById("langToggle");
  if(langToggle){
    langToggle.onclick = () => {
      LANG = LANG === "th" ? "en" : "th";
      if(langLabel) langLabel.textContent = LANG === "th" ? "EN" : "TH";
      render();
    };
  }
  if(!location.hash) location.hash = "/";
  render();
});
</script>
</body>
</html>
