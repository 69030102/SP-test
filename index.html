<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART PARKING — รับบัตรจอดรถ</title>

<!-- PyScript Core Engine -->
<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --counter:#312a24;
    --paper:#fbfaf4;
    --ink:#1c1a17;
    --muted:#8c8377;
    --stamp:#b5292f;
    --font-th: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--font-th);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      var(--counter);
    color:var(--paper);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .app{ width:100%; max-width:320px; position:relative; }

  .topbar{ display:flex; justify-content:flex-end; margin-bottom:14px; }
  .lang-toggle{
    background:transparent; border:1px solid rgba(251,250,244,0.3); border-radius:3px;
    color:rgba(251,250,244,0.75); font-family:var(--font-th); font-size:11px; font-weight:700;
    padding:5px 10px; cursor:pointer;
  }
  .lang-toggle:hover{ border-color:var(--paper); color:var(--paper); }

  .receipt-wrap{ position:relative; }
  .torn{ height:9px; }
  .torn.top{
    background-image: linear-gradient(45deg, var(--counter) 6px, transparent 0), linear-gradient(-45deg, var(--counter) 6px, transparent 0);
    background-position: left bottom; background-size: 12px 9px; background-repeat: repeat-x;
    background-color: var(--paper);
  }
  .torn.bottom{
    background-image: linear-gradient(135deg, var(--counter) 6px, transparent 0), linear-gradient(-135deg, var(--counter) 6px, transparent 0);
    background-position: left top; background-size: 12px 9px; background-repeat: repeat-x;
    background-color: var(--paper);
  }

  /* ปรับแต่งสำหรับแก้ปัญหาอักษรทับกันเมื่อถูกแปลงเป็นภาพ Canvas */
  .receipt{
    background:var(--paper); color:var(--ink);
    padding:26px 22px;
    box-shadow: 0 18px 34px -14px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.25);
    overflow:visible;
    letter-spacing: 0px !important;
    word-spacing: 0px !important;
  }

  .store{ text-align:center; margin-bottom:4px; }
  .store-name{ font-weight:700; font-size:16px; font-family:var(--font-mono); letter-spacing:0.5px; }
  .store-sub{ font-size:11.5px; color:var(--muted); margin-top:3px; line-height: 1.4; }

  .dash{ height:0; margin:16px 0; border-top:1px dashed rgba(28,26,23,0.35); }

  .msg-title{ font-size:14px; font-weight:700; margin:0 0 6px 0; line-height:1.4; text-align:center; }
  .msg-sub{ font-size:12px; color:var(--muted); line-height:1.5; text-align:center; margin:0; }

  .status-line{ font-size:11px; color:var(--muted); text-align:center; margin:10px 0 0 0; }

  /* ปรับแต่งส่วนแสดงแถวข้อมูล (Line Items) */
  .li{ display:flex; align-items:center; justify-content:space-between; gap:4px; font-size:12px; margin:8px 0; line-height: 1.5; }
  .li .lbl{ color:var(--muted); white-space:nowrap; }
  .li .fill{ flex:1; border-bottom:1px dotted rgba(28,26,23,0.35); margin:0 4px; height:12px; }
  .li .val{ font-weight:700; white-space:nowrap; text-align:right; }
  .num-val{ font-family: var(--font-mono); font-size: 11.5px; }

  .qr-label{ text-align:center; font-size:10px; font-weight:700; font-family:var(--font-mono); letter-spacing:1px; color:var(--muted); margin:12px 0 6px; }
  .qr-wrap{ display:flex; justify-content:center; padding:6px 0; }
  #qrcode img, #qrcode canvas{ display:block; }

  .footer-note{ text-align:center; font-size:10.5px; color:var(--muted); line-height:1.5; margin-top:12px; }

  .stamp{
    position:absolute; top:10px; right:8px;
    width:78px; height:78px; border:3px solid var(--stamp); border-radius:50%;
    color:var(--stamp); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:11px; text-align:center; line-height:1.3;
    transform:rotate(-16deg); opacity:0.88;
    background:rgba(251,250,244,0.01);
  }

  .btn{
    width:100%; display:block; text-align:center; padding:12px 16px; margin-top:20px;
    border-radius:3px; font-size:13px; font-weight:700; font-family:var(--font-th);
    border:1.5px solid var(--paper); cursor:pointer; text-decoration:none; background:transparent; color:var(--paper);
    transition:background .15s ease, color .15s ease;
  }
  .btn:hover{ background:var(--paper); color:var(--ink); }

  .rate-note{ text-align:center; font-size:11px; color:rgba(251,250,244,0.55); margin-top:14px; line-height:1.6; }

  .staff-link{
    display:block; text-align:center; font-size:11px; color:rgba(251,250,244,0.55);
    text-decoration:none; margin-top:16px;
  }
  .staff-link:hover{ color:var(--paper); }

  .error .msg-title{ color:var(--stamp); }

  @keyframes printOut{ from{ clip-path: inset(0 0 100% 0); } to{ clip-path: inset(0 0 0 0); } }
  .print-in{ animation: printOut .55s steps(16, end) both; }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .fade-in{ animation: fadeIn .4s ease both; }

  @keyframes stampIn{
    from{ transform:rotate(-16deg) scale(2.2); opacity:0; }
    to{ transform:rotate(-16deg) scale(1); opacity:0.88; }
  }
  .stamp-in{ animation: stampIn .35s cubic-bezier(.3,1.4,.5,1) .5s both; }

  @media (prefers-reduced-motion: reduce){
    .print-in, .fade-in, .stamp-in{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="lang-toggle" id="langToggle" type="button" aria-label="Toggle language">
      <span id="langLabel">EN</span>
    </button>
  </div>
  <div id="view"></div>
</div>

<!-- ==================== PYTHON CORE ENGINE ==================== -->
<script type="py">
import time
import random

def gen_ticket_id_py():
    t_ms = int(time.time() * 1000)
    t_hex = hex(t_ms)[2:].upper()
    rand_suffix = format(random.randint(0, 255), '02X')
    return "P-" + t_hex[-6:] + rand_suffix
</script>

<!-- ==================== HIGH-PERFORMANCE JS FLOW ENGINE ==================== -->
<script>
const CONFIG = {
  FREE_MINUTES: 60,
  RATE_PER_HOUR: 20,
  CURRENCY: "฿"
};

let LANG = "th";

const STR = {
  th: {
    store_sub: "ทางเข้า · จุดออกบัตรอัตโนมัติ",
    home_title: "สแกน QR เพื่อรับบิลจอดรถ",
    home_sub: "ใช้กล้องมือถือสแกนโค้ดด้านล่าง ระบบจะออกบิลจอดรถให้ทันทีตามเวลาที่สแกน",
    scan_label: "SCAN TO ENTER",
    awaiting: "รอสแกน...",
    ticket_sub: "เก็บใบนี้ไว้ หรือบันทึกเป็นรูปภาพ แสดง QR ด้านล่างตอนออกจากลานจอด",
    label_id: "หมายเลขบัตร",
    label_checkin: "เวลาเข้าจอด",
    label_rate: "อัตราค่าจอด",
    stamp_text: "เข้าจอด\nแล้ว",
    exit_label: "SCAN TO EXIT",
    save_ticket_btn: "บันทึกบัตรลงมือถือ",
    rate_note: h => `ชั่วโมงแรกฟรี จากนั้นคิด ${CONFIG.CURRENCY}${h} ต่อชั่วโมง`,
    not_found_title: "ไม่พบข้อมูลบัตร",
    not_found_sub: "ลิงก์นี้ไม่ถูกต้องหรือหมดอายุ",
    back_home: "กลับหน้าแรก",
    staff_link: "สำหรับเจ้าหน้าที่ (สแกนออก) →",
    footer_note: "โปรดเก็บใบนี้ไว้จนกว่าจะออกจากลานจอด"
  },
  en: {
    store_sub: "Entry Terminal · Auto Ticketing",
    home_title: "Scan the QR to get a parking ticket",
    home_sub: "Use your phone camera to scan the code below. A ticket will be issued instantly.",
    scan_label: "SCAN TO ENTER",
    awaiting: "Awaiting scan...",
    ticket_sub: "Keep this ticket, or save it as an image. Show the QR below when you leave.",
    label_id: "Ticket No.",
    label_checkin: "Check-in time",
    label_rate: "Rate",
    stamp_text: "ENTRY\nOK",
    exit_label: "SCAN TO EXIT",
    save_ticket_btn: "Save ticket to phone",
    rate_note: h => `First hour free, then ${CONFIG.CURRENCY}${h} per hour`,
    not_found_title: "Ticket not found",
    not_found_sub: "This link is invalid or expired.",
    back_home: "Back to home",
    staff_link: "Staff exit scanner →",
    footer_note: "Please keep this ticket until you leave the car park"
  }
};

function tr(k, ...args){
  const v = STR[LANG][k];
  return typeof v === "function" ? v(...args) : v;
}

function dtLocale(){ return LANG === "th" ? "th-TH" : "en-GB"; }

// ฟังก์ชันจัดรูปแบบเวลาใหม่ เพิ่มการเว้นวรรคให้ตรงตามมาตรฐาน ป้องกัน html2canvas แสดงผลซ้อนทับ
function fmtDateTime(ms){
  const d = new Date(ms);
  const dateStr = d.toLocaleDateString(dtLocale(), { day:'2-digit', month:'2-digit', year:'numeric' });
  const timeStr = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false });
  return `<span class="num-val">${dateStr}&nbsp;&nbsp;${timeStr}</span>`;
}

function playDing(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(1318.51, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.55);
  }catch(e){}
}

function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function parseHash(){
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = hash.split("?");
  const params = new URLSearchParams(qs || "");
  return { path: path || "/", params };
}

function buildUrl(path, params){
  const qs = new URLSearchParams(params).toString();
  return location.origin + location.pathname + "#" + path + (qs ? "?" + qs : "");
}

function lineItem(label, value){
  return `<div class="li"><span class="lbl">${label}</span><span class="fill"></span><span class="val">${value}</span></div>`;
}

function render(){
  const { path, params } = parseHash();
  const view = document.getElementById("view");
  view.innerHTML = "";

  if(path === "/") renderHome(view);
  else if(path === "/checkin") handleCheckin();
  else if(path === "/ticket") renderTicket(view, params);
  else renderNotFound(view);
}

function renderHome(view){
  view.innerHTML = `
    <div class="receipt-wrap fade-in">
      <div class="torn top"></div>
      <div class="receipt">
        <div class="store">
          <div class="store-name">SMART PARKING</div>
          <div class="store-sub">${tr('store_sub')}</div>
        </div>
        <div class="dash"></div>
        <p class="msg-title">${tr('home_title')}</p>
        <p class="msg-sub">${tr('home_sub')}</p>
        <div class="qr-label">${tr('scan_label')}</div>
        <div class="qr-wrap" id="qrcode"></div>
        <p class="status-line">${tr('awaiting')}</p>
      </div>
      <div class="torn bottom"></div>
    </div>
    <a class="staff-link" href="exit-scan.html">${tr('staff_link')}</a>
  `;
  const url = buildUrl("/checkin", {});
  new QRCode(document.getElementById("qrcode"), { text: url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
}

function handleCheckin(){
  let ticketId = "";
  try {
    if(window.pyscript && pyscript.interpreter && pyscript.interpreter.globals){
      const pyGen = pyscript.interpreter.globals.get('gen_ticket_id_py');
      ticketId = pyGen();
    }
  } catch(e) {}

  if(!ticketId){
    const randSuffix = Math.random().toString(36).slice(2, 4).toUpperCase();
    ticketId = "P-" + Date.now().toString(36).toUpperCase().slice(-6) + randSuffix;
  }

  const t = Date.now();
  location.replace(buildUrl("/ticket", { id: ticketId, t }));
}

function renderTicket(view, params){
  const id = params.get("id");
  const t = Number(params.get("t"));
  if(!id || !t) return renderNotFound(view);

  view.innerHTML = `
    <div class="receipt-wrap">
      <div class="torn top"></div>
      <div class="receipt print-in" id="ticketCard">
        <div class="stamp stamp-in" id="entryStamp">${tr('stamp_text').replace('\n','<br>')}</div>
        <div class="store">
          <div class="store-name">SMART PARKING</div>
          <div class="store-sub">${tr('store_sub')}</div>
        </div>
        <div class="dash"></div>
        <p class="msg-sub" style="margin-bottom:12px;">${tr('ticket_sub')}</p>
        ${lineItem(tr('label_id'), `<span class="num-val">${id}</span>`)}
        ${lineItem(tr('label_checkin'), fmtDateTime(t))}
        ${lineItem(tr('label_rate'), `<span class="num-val">${CONFIG.CURRENCY}${CONFIG.RATE_PER_HOUR}/ชม.</span>`)}
        <div class="dash"></div>
        <div class="qr-label">${tr('exit_label')}</div>
        <div class="qr-wrap" id="qrcode"></div>
        <p class="footer-note">${tr('footer_note')}</p>
      </div>
      <div class="torn bottom"></div>
    </div>
    <button class="btn no-print" id="saveBtn">${tr('save_ticket_btn')}</button>
    <p class="rate-note">${tr('rate_note', CONFIG.RATE_PER_HOUR)}</p>
  `;

  const checkoutUrl = buildUrl("/checkout", { id, t });
  new QRCode(document.getElementById("qrcode"), { text: checkoutUrl, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });

  playDing();
  vibrate(60);

  document.getElementById("saveBtn").onclick = async () => {
    const btn = document.getElementById("saveBtn");
    const originalLabel = btn.textContent;
    btn.disabled = true;
    try{
      if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
      
      const targetCard = document.getElementById("ticketCard");
      
      const canvas = await html2canvas(targetCard, { 
        backgroundColor: "#fbfaf4", 
        scale: 2,
        useCORS: true,
        letterRendering: true,
        allowTaint: true,
        logging: false
      });
      
      const link = document.createElement("a");
      link.download = "parking-ticket-" + id + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  };
}

function renderNotFound(view){
  view.innerHTML = `
    <div class="receipt-wrap fade-in">
      <div class="torn top"></div>
      <div class="receipt error">
        <div class="store">
          <div class="store-name">SMART PARKING</div>
        </div>
        <div class="dash"></div>
        <p class="msg-title">${tr('not_found_title')}</p>
        <p class="msg-sub">${tr('not_found_sub')}</p>
        <a class="btn" href="#/" style="color:var(--ink); border-color:var(--ink);">${tr('back_home')}</a>
      </div>
      <div class="torn bottom"></div>
    </div>
  `;
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  const langLabel = document.getElementById("langLabel");
  const langToggle = document.getElementById("langToggle");
  if(langToggle){
    langToggle.onclick = () => {
      LANG = LANG === "th" ? "en" : "th";
      if(langLabel) langLabel.textContent = LANG === "th" ? "EN" : "TH";
      render();
    };
  }
  
  if(document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if(!location.hash) location.hash = "/";
      render();
    });
  } else {
    if(!location.hash) location.hash = "/";
    render();
  }
});
</script>
</body>
</html>
